version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      backend-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      # Runtime-critical majors need a deliberate migration, not an automated bump.
      - dependency-name: express
        update-types:
          - version-update:semver-major
      - dependency-name: mongoose
        update-types:
          - version-update:semver-major
      - dependency-name: bcryptjs
        update-types:
          - version-update:semver-major
      - dependency-name: express-rate-limit
        update-types:
          - version-update:semver-major
      - dependency-name: multer
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      frontend-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      # React and Vite majors require a coordinated upgrade and full re-test.
      - dependency-name: react
        update-types:
          - version-update:semver-major
      - dependency-name: react-dom
        update-types:
          - version-update:semver-major
      - dependency-name: vite
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
