name: Feature request
description: Suggest an improvement that fits the project's essentials-only scope.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        This project intentionally keeps a focused scope. Requests that reintroduce removed features may be declined.

  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What school workflow is difficult today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful change.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Public website
        - Admissions
        - Academics and results
        - Finance
        - Discipline
        - Registration and records
        - Notifications
        - Website content
        - Deployment and operations
        - Documentation
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope and security impact
      description: Which roles are affected? Does this change data-access boundaries?
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: This request does not reintroduce a feature the project intentionally removed.
          required: true
